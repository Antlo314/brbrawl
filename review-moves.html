<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move Review</title>
<!-- Dev page (not shipped: sync-game.js copies only the game's own files). Every animation-formula move of one battler, looping at
     game speed or slowed down, frame by frame, next to his old version. review-moves.html?b=rosenberg -->
<style>
  :root { --bg: #0b0b10; --card: #14141c; --line: #26262e; --ink: #f2efe8; --mute: #8d8a99; --hot: #ff5a1f; --gold: #ffd23f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, Segoe UI, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: rgba(11,11,16,.94); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  h1 { font: 700 20px/1.1 Impact, Anton, sans-serif; letter-spacing: .04em; margin: 0; }
  .ctl { display: flex; gap: 6px; align-items: center; }
  .ctl span { color: var(--mute); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; margin-right: 2px; }
  button { font: 600 13px system-ui, sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button.on { background: var(--hot); border-color: var(--hot); color: #160800; }
  main { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; max-width: 1500px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .card h2 { font: 700 17px/1.1 Impact, Anton, sans-serif; letter-spacing: .05em; margin: 0; padding: 10px 12px 2px; }
  .card p { margin: 0; padding: 0 12px 8px; color: var(--mute); font-size: 13px; }
  .views { display: grid; grid-template-columns: 1fr; }
  .views.cmp { grid-template-columns: 1fr 1fr; }
  .view { position: relative; }
  .view canvas { display: block; width: 100%; aspect-ratio: 1; background: radial-gradient(ellipse at 50% 85%, #3a2f45, #15121c 70%); }
  .view.stage canvas { background: center 78% / 260% auto url('art/stage.jpg'); }
  .view b { position: absolute; left: 8px; top: 6px; font: 700 11px system-ui, sans-serif; letter-spacing: .12em; color: var(--gold); text-shadow: 0 1px 2px #000; }
  .meta { display: flex; justify-content: space-between; padding: 6px 12px 10px; color: var(--mute); font-size: 12px; font-variant-numeric: tabular-nums; }
  .note { color: var(--mute); font-size: 13px; max-width: 1500px; margin: 0 auto; padding: 0 16px 24px; }
  @media (max-width: 520px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1 id="title">NEW MOVES</h1>
  <div class="ctl"><span>Speed</span><button data-speed="1" class="on">Game</button><button data-speed="0.5">½</button><button data-speed="0.25">¼</button></div>
  <div class="ctl"><span>Frames</span><button id="pause">Pause</button><button id="prev">◀</button><button id="next">▶</button></div>
  <div class="ctl"><span>Show</span><button id="cmp" class="on">Old vs new</button><button id="bg">On the stage</button></div>
</header>
<main id="grid"></main>
<p class="note">Each move plays at the speed it runs in a fight (a punch is over in about a quarter of a second). Slow it down or pause and step through the frames to see every pose. "Old" is the move he has in the game today without the new sheets.</p>
<script>
'use strict';
const bid = new URLSearchParams(location.search).get('b') || 'rosenberg';
const SP = `sprites/${bid}/`;
document.getElementById('title').textContent = `${bid.toUpperCase()} · NEW MOVES`;
// file, columns, rows, cell indexes, frame lengths in game frames (60 a second), as the game times them
const strike = (s, a, r) => [1, s - 1, a, r];
const MOVES = [
  { name: 'WALK', note: '8 frames (the smoothness test)', now: ['smooth_walk', 4, 2, [0, 1, 2, 3, 4, 5, 6, 7], Array(8).fill(6)], old: ['sheet_1', 3, 3, [3, 4, 5, 6], [6, 6, 6, 6]] },
  { name: 'JUMP', note: 'crouch, takeoff, rise, tuck, fall, landing', now: ['anim_jump', 4, 2, [0, 1, 2, 3, 4, 5, 6, 7], [10, 4, 6, 8, 12, 12, 5, 4]], old: ['sheet_1', 3, 3, [0, 7, 8, 0], [10, 20, 20, 10]] },
  { name: 'KNOCKDOWN + GET-UP', note: 'hit, airborne, falling, slam, bounce, lying, two get-up frames', now: ['anim_fall', 4, 2, [0, 1, 2, 3, 4, 5, 6, 7], [6, 8, 8, 5, 6, 30, 8, 8]], old: ['sheet_3', 3, 3, [6, 7, 8], [22, 30, 16]] },
  { name: 'JAB', note: 'front hand (the arm away from us)', now: ['anim_punch_a', 4, 2, [0, 1, 2, 3], strike(4, 3, 9)], old: ['sheet_2', 3, 3, [0, 1, 2], [4, 3, 9]] },
  { name: 'CROSS', note: 'back hand', now: ['anim_punch_a', 4, 2, [4, 5, 6, 7], strike(4, 3, 9)], old: ['sheet_2', 3, 3, [0, 1, 2], [4, 3, 9]] },
  { name: 'HOOK', note: 'back hand (a front-hand hook never came out right)', now: ['anim_punch_b', 4, 2, [0, 1, 2, 3], strike(4, 3, 9)], old: ['sheet_2', 3, 3, [0, 1, 2], [4, 3, 9]] },
  { name: 'UPPERCUT', note: 'back hand', now: ['anim_punch_b', 4, 2, [4, 5, 6, 7], strike(4, 3, 9)], old: ['sheet_2', 3, 3, [0, 1, 2], [4, 3, 9]] },
  { name: 'FRONT KICK', note: 'front leg', now: ['anim_kick_a', 4, 2, [0, 1, 2, 3], strike(8, 4, 16)], old: ['sheet_2', 3, 3, [3, 4, 5], [8, 4, 16]] },
  { name: 'ROUNDHOUSE', note: 'back leg', now: ['anim_kick_a', 4, 2, [4, 5, 6, 7], strike(8, 4, 16)], old: ['sheet_2', 3, 3, [3, 4, 5], [8, 4, 16]] },
  { name: 'HIGH KICK', note: 'back leg', now: ['anim_kick_b', 4, 2, [4, 5, 6, 7], strike(8, 4, 16)], old: ['sheet_2', 3, 3, [3, 4, 5], [8, 4, 16]] },
  { name: 'LOW KICK', note: 'front leg', now: ['anim_kick_b', 4, 2, [0, 1, 2, 3], strike(8, 4, 16)], old: ['sheet_2', 3, 3, [3, 4, 5], [8, 4, 16]] },
];
const GAP = 24; // a breath between loops, in game frames
let speed = 1, paused = false, compare = true, onStage = false, clock = 0;

const sheets = {};
const loadSheet = f => sheets[f] || (sheets[f] = new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = SP + f + '.jpg'; }));
// one cell, green keyed out, trimmed to the figure (feet = its bottom)
function cutCell(im, cols, rows, i) {
  const cw = im.width / cols, ch = im.height / rows, c = document.createElement('canvas');
  const k = Math.min(1, 640 / cw); c.width = Math.round(cw * k); c.height = Math.round(ch * k);
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(im, (i % cols) * cw, Math.floor(i / cols) * ch, cw, ch, 0, 0, c.width, c.height);
  const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
  let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
  for (let j = 0; j < p.length; j += 4) {
    const r = p[j], gr = p[j + 1], b = p[j + 2], spill = gr - Math.max(r, b);
    const a = Math.max(0, Math.min(255, (70 - spill) * 255 / 40));
    if (spill > 0) p[j + 1] = Math.max(r, b);
    p[j + 3] = a;
    if (a > 128) { const x = (j / 4) % c.width, y = (j / 4 / c.width) | 0; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  g.putImageData(d, 0, 0);
  return { c, box: [x0, y0, x1 - x0 + 1, y1 - y0 + 1] };
}
async function build(spec) {
  const [f, cols, rows, cells, lens] = spec, im = await loadSheet(f);
  if (!im) return null;
  const frames = cells.map(i => cutCell(im, cols, rows, i));
  const stand = frames[0].box[3] || 1; // sized by the first (standing) frame
  return { frames, lens, stand, total: lens.reduce((s, v) => s + v, 0) + GAP };
}
function frameAt(a, t) {
  let u = t % a.total;
  for (let i = 0; i < a.lens.length; i++) { if (u < a.lens[i]) return i; u -= a.lens[i]; }
  return a.lens.length - 1; // the breath holds the last frame
}
function draw(cv, a, idx) {
  const g = cv.getContext('2d'), W = cv.width, H = cv.height; g.clearRect(0, 0, W, H);
  if (!a) { g.fillStyle = '#8d8a99'; g.font = '16px system-ui'; g.textAlign = 'center'; g.fillText('not drawn yet', W / 2, H / 2); return; }
  const fr = a.frames[idx], [x, y, w, h] = fr.box, k = (H * 0.62) / a.stand;
  g.imageSmoothingQuality = 'high';
  g.drawImage(fr.c, x, y, w, h, W / 2 - w * k / 2, H * 0.9 - h * k, w * k, h * k);
}
const cards = [];
(async () => {
  const grid = document.getElementById('grid');
  for (const m of MOVES) {
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<h2></h2><p></p><div class="views cmp"><div class="view"><b>OLD</b><canvas width="480" height="480"></canvas></div><div class="view"><b>NEW</b><canvas width="480" height="480"></canvas></div></div><div class="meta"><span class="fi"></span><span class="ms"></span></div>`;
    card.querySelector('h2').textContent = m.name; card.querySelector('p').textContent = m.note;
    grid.appendChild(card);
    const [now, old] = await Promise.all([build(m.now), build(m.old)]);
    const [cvOld, cvNew] = card.querySelectorAll('canvas');
    card.querySelector('.ms').textContent = now ? `${Math.round((now.total - GAP) / 60 * 1000)} ms in a fight` : '';
    cards.push({ card, now, old, cvOld, cvNew, fi: card.querySelector('.fi') });
  }
  render(); requestAnimationFrame(tick);
})();
// Playing, every card follows the clock; paused, each card holds its own frame (c.i, c.oi) and the arrows step it.
function render() {
  for (const c of cards) {
    if (!paused) { c.i = c.now ? frameAt(c.now, clock) : 0; c.oi = c.old ? frameAt(c.old, clock) : 0; }
    draw(c.cvNew, c.now, c.i); c.fi.textContent = c.now ? `frame ${c.i + 1} of ${c.now.frames.length}` : '';
    if (compare) draw(c.cvOld, c.old, c.oi);
  }
}
let last = 0;
function tick(ts) {
  if (!paused && last) clock += (ts - last) / 1000 * 60 * speed;
  last = ts; render(); requestAnimationFrame(tick);
}
document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => {
  speed = +b.dataset.speed; document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('on', x === b));
}));
document.getElementById('pause').addEventListener('click', e => { paused = !paused; e.target.classList.toggle('on', paused); e.target.textContent = paused ? 'Play' : 'Pause'; });
// stepping moves every card to its next (previous) frame
function step(dir) {
  if (!paused) document.getElementById('pause').click();
  for (const c of cards) {
    if (c.now) c.i = (c.i + dir + c.now.frames.length) % c.now.frames.length;
    if (c.old) c.oi = (c.oi + dir + c.old.frames.length) % c.old.frames.length;
  }
  render();
}
document.getElementById('prev').addEventListener('click', () => step(-1));
document.getElementById('next').addEventListener('click', () => step(1));
document.getElementById('cmp').addEventListener('click', e => {
  compare = !compare; e.target.classList.toggle('on', compare);
  document.querySelectorAll('.views').forEach(v => { v.classList.toggle('cmp', compare); v.firstElementChild.hidden = !compare; });
});
document.getElementById('bg').addEventListener('click', e => {
  onStage = !onStage; e.target.classList.toggle('on', onStage);
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('stage', onStage));
});
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); document.getElementById('pause').click(); }
  if (e.code === 'ArrowRight') step(1);
  if (e.code === 'ArrowLeft') step(-1);
});
</script>
</body>
</html>
