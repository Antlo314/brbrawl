<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BRBrawl UI Button Kit Preview</title><link rel="stylesheet" href="brbrawl-ui.css"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:clamp(1rem,4vw,3rem);color:#f5eee4;background:radial-gradient(ellipse at 50% 0%,#251321 0,#07050b 62%);font-family:Inter,Arial,sans-serif}.wrap{max-width:1100px;margin:auto}.eyebrow{font:10px 'Press Start 2P','Courier New',monospace;color:#f4c45d;letter-spacing:.08em}h1,h2{font-family:Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em}h1{font-size:clamp(2rem,6vw,4rem);margin:.45rem 0}p{color:#b9acbb}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.9fr);gap:2rem;margin-top:2rem}.brb-menu{max-width:none}.brb-settings{align-self:start}.actions{display:flex;gap:.6rem;margin-top:1rem}.actions .brb-btn{width:auto;min-width:8rem;justify-content:center;padding-left:1.2rem}.tag-input{width:100%;padding:.85rem 1rem;background:#09070d;border:1px solid #786370;color:#f5eee4;font:600 1rem Inter,Arial,sans-serif}.note{font-size:.82rem;color:#9b8d9b}.hide{display:none}@media(max-width:780px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><p class="eyebrow">BATTLE RAP BRAWL · UI KIT</p><h1>Menu & Settings</h1><p>Arcade selection buttons, responsive focus states, and the current Settings controls.</p><div class="grid"><section><h2 class="eyebrow">MAIN MENU</h2><div class="brb-menu" role="group" aria-label="Game modes"><button class="brb-btn" aria-pressed="true">STORY <span class="brb-btn__hint">A NIGHTMARE ON THE BLOCK</span></button><button class="brb-btn">ARCADE <span class="brb-btn__hint">FIVE TIERS</span></button><button class="brb-btn">THE CLOSER</button><button class="brb-btn">WIN THE CROWD</button><button class="brb-btn">GHOST SURVIVAL</button><button class="brb-btn">VERSUS</button><button class="brb-btn">ONLINE BATTLE</button><button class="brb-btn">SELECT FIGHTER</button><button class="brb-btn">SETTINGS</button><button class="brb-btn">BACK</button></div></section><section class="brb-settings"><p class="eyebrow">SETTINGS</p><div class="brb-tabs" role="tablist"><button class="brb-tab" role="tab" aria-selected="true">GAME</button><button class="brb-tab" role="tab" aria-selected="false">AUDIO</button><button class="brb-tab" role="tab" aria-selected="false">CONTROLS</button><button class="brb-tab" role="tab" aria-selected="false">ACCESSIBILITY</button></div><label class="eyebrow" for="tag">GAMER TAG</label><input class="tag-input" id="tag" maxlength="18" placeholder="Enter tag"><div class="brb-setting-row">Clean Mode <button class="brb-toggle" aria-pressed="false">OFF</button></div><div class="brb-setting-row">Music <button class="brb-toggle" aria-pressed="true">ON</button></div><div class="brb-setting-row">Sound Effects <button class="brb-toggle" aria-pressed="true">ON</button></div><div class="brb-setting-row">Music Volume <input class="brb-slider" type="range" min="0" max="100" value="64" aria-label="Music volume"></div><div class="actions"><button class="brb-btn">BACK</button><button class="brb-btn is-selected">APPLY</button></div><p class="note">Preview only. The button styles and settings controls need to be wired to the game’s menu/state logic.</p></section></div></main><script>
document.querySelectorAll('.brb-menu .brb-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.brb-menu .brb-btn').forEach(b=>b.setAttribute('aria-pressed','false'));btn.setAttribute('aria-pressed','true')}));document.querySelectorAll('.brb-toggle').forEach(btn=>btn.addEventListener('click',()=>{const on=btn.getAttribute('aria-pressed')!=='true';btn.setAttribute('aria-pressed',String(on));btn.textContent=on?'ON':'OFF'}));document.querySelectorAll('.brb-tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.brb-tab').forEach(b=>b.setAttribute('aria-selected','false'));btn.setAttribute('aria-selected','true')}));
</script></body></html>
